services:
  mysql:
    image: mysql:8.0
    container_name: invemoto_mysql
    restart: unless-stopped
    # Si falta el .env de la raiz, Docker se detiene con este mensaje en vez de
    # arrancar MySQL con contrasenas en blanco.
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta el archivo .env en la raiz del repositorio. Copia .env.example a .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Falta el archivo .env en la raiz del repositorio. Copia .env.example a .env}
      MYSQL_USER: ${MYSQL_USER:?Falta el archivo .env en la raiz del repositorio. Copia .env.example a .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Falta el archivo .env en la raiz del repositorio. Copia .env.example a .env}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - invemoto_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: invemoto_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # La conexion a la base de datos sale del .env de la raiz y tiene prioridad
    # sobre lo que diga backend/.env: asi las credenciales no se repiten ni
    # pueden quedar desalineadas. Dentro de la red de Docker MySQL siempre
    # escucha en el puerto 3306 (el 3307 es solo para tu equipo).
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - invemoto_net
    command: npm run start:dev

  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile.dev
    container_name: invemoto_analytics
    restart: unless-stopped
    # analytics/.env es opcional: si existe se usa, si no existe no pasa nada.
    env_file:
      - path: ./analytics/.env
        required: false
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - ./analytics:/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - invemoto_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: invemoto_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - invemoto_net
    command: npm run dev -- --host

networks:
  invemoto_net:
    driver: bridge

volumes:
  mysql_data: